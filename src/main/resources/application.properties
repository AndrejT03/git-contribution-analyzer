spring.application.name=git-contribution-ai
spring.config.import=optional:file:.env[.properties]
spring.thymeleaf.cache=false
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

app.max-commits=${MAX_COMMITS:80}
app.max-diff-chars=${MAX_DIFF_CHARS:6000}
app.git-timeout-seconds=${GIT_TIMEOUT_SECONDS:120}
app.gemini-api-key=${GEMINI_API_KEY:}
app.gemini-model=${GEMINI_MODEL:gemini-3.7-flash}
app.gemini-timeout-seconds=${GEMINI_TIMEOUT_SECONDS:180}
app.mail-enabled=${MAIL_ENABLED:false}
app.mail-from=${MAIL_FROM:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000