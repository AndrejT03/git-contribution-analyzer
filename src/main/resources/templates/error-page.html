<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <title th:text="${status} + ' · Git Contribution AI'">Error · Git Contribution AI</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css(v='25.9')}">
</head>
<body class="error-body">
<header class="site-header site-header--quiet">
  <div class="site-header__inner site-header__inner--compact">
    <a class="site-brand" th:href="@{/}" aria-label="Git Contribution AI home">
      <span class="site-brand__mark" aria-hidden="true"><i class="bi bi-bezier2"></i></span>
      <span class="site-brand__name">Git Contribution <span>AI</span></span>
    </a>
  </div>
</header>

<main class="error-page">
  <section class="error-card" data-error-card aria-live="polite">
    <p class="error-code">Error <span data-error-status th:text="${status}">404</span></p>
    <div class="error-icon" aria-hidden="true">
            <span class="error-document-icon">
                <i class="bi bi-file-earmark"></i>
                <i class="bi bi-exclamation-lg"></i>
            </span>
    </div>
    <h1 data-error-heading th:text="${errorHeading}">We couldn't find that analysis</h1>
    <p data-error-description th:text="${errorDescription}">
      The analysis or report you're looking for doesn't exist or is no longer available.
    </p>
    <a class="primary-link error-home-link" th:href="@{/}">
      <i class="bi bi-house-door" aria-hidden="true"></i> Back to home
    </a>
  </section>

  <nav class="error-preview" aria-label="Preview error states" th:if="${previewMode == true}">
    <span>Preview:</span>
    <button type="button" data-error-preview="400"
            th:attr="aria-pressed=${status == 400}"
            th:classappend="${status == 400 ? 'is-selected' : ''}">400</button>
    <button type="button" data-error-preview="404"
            th:attr="aria-pressed=${status == 404}"
            th:classappend="${status == 404 ? 'is-selected' : ''}">404</button>
    <button type="button" data-error-preview="500"
            th:attr="aria-pressed=${status == 500}"
            th:classappend="${status == 500 ? 'is-selected' : ''}">500</button>
  </nav>
</main>

<script th:src="@{/js/app.js(v='25.9')}"></script>
</body>
</html>
