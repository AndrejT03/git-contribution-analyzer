<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="'Git Contribution AI · ' + ${report.repositoryName}">Git Contribution AI</title>
</head>
<body style="margin:0;padding:0;background:#f4f6fb;color:#182033;font-family:Arial,sans-serif;">
<div style="max-width:760px;margin:0 auto;padding:30px 16px;">
  <div style="padding:30px;border-radius:18px;background:#4435bd;color:white;">
    <p style="margin:0 0 10px;font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;"
       th:text="${report.analysisSource.displayName()} + ' Report'">Contribution Analysis Report</p>
    <h1 style="margin:0 0 14px;font-size:34px;" th:text="${report.repositoryName}">Project</h1>
    <p style="margin:0;line-height:1.6;color:#efedff;" th:text="${report.analysis.projectSummary}">Summary</p>
    <p style="margin:14px 0 0;line-height:1.5;color:#efedff;"
       th:text="'Engine: ' + ${report.analysisModel}">Analysis engine</p>
    <p style="margin:14px 0 0;line-height:1.5;color:#efedff;" th:text="${report.analysisNotice}">Analysis details</p>
  </div>

  <div style="margin-top:18px;padding:24px;border:1px solid #dfe4ef;border-radius:14px;background:white;">
    <h2 style="margin-top:0;">Contribution by member</h2>
    <div th:each="contributor : ${report.analysis.contributors}"
         style="margin-top:18px;padding-top:18px;border-top:1px solid #dfe4ef;">
      <table style="width:100%;border-collapse:collapse;">
        <tr>
          <td>
            <strong style="font-size:18px;" th:text="${contributor.name}">Name</strong><br>
            <small style="color:#65708a;" th:text="${contributor.email}">email</small>
          </td>
          <td style="text-align:right;color:#5b4bdb;font-size:24px;font-weight:bold;"
              th:text="${contributor.contributionPercentage} + '%'">0%</td>
        </tr>
      </table>
      <p style="line-height:1.55;" th:text="${contributor.summary}">Summary</p>
      <ul style="line-height:1.55;">
        <li th:each="work : ${contributor.mainWork}" th:text="${work}">Work</li>
      </ul>
    </div>
  </div>

  <div style="margin-top:18px;padding:24px;border:1px solid #dfe4ef;border-radius:14px;background:white;">
    <h2 style="margin-top:0;">Conclusion</h2>
    <p style="line-height:1.6;" th:text="${report.analysis.conclusion}">Conclusion</p>
  </div>

  <p style="margin:20px 6px 0;color:#65708a;font-size:12px;line-height:1.5;">
    An HTML copy of the report is attached. The assessment is based on the supplied Git commit history.
  </p>
</div>
</body>
</html>
