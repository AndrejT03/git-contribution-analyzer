<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="commitRows(commits)">
    <article class="commit-row" th:each="commit : ${commits}">
        <div class="commit-title">
            <code th:text="${#strings.substring(commit.hash, 0, 7)}">3c9de44</code>
            <strong th:text="${commit.message}">Commit message</strong>
        </div>
        <div class="commit-meta">
            <span class="commit-category" th:classappend="${commit.category.cssClass()}"
                  th:text="${commit.category.displayName()}">Functional</span>
            <span>Importance</span>
            <span class="importance-dots" th:attr="aria-label=|Importance ${commit.importance} out of 5|">
                <i th:each="point : ${#numbers.sequence(1, 5)}"
                   th:classappend="${point <= commit.importance ? ' is-active' : ''}"></i>
            </span>
            <span th:text="${commit.importance} + '/5'">4/5</span>
        </div>
        <p th:text="${commit.explanation}">Commit explanation.</p>
    </article>
</th:block>
</body>
</html>
